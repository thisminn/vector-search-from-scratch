[project]
name = "vector-search-from-scratch"
version = "0.1.0"
description = "A learning-focused project for implementing vector search fundamentals from first principles."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sentence-transformers>=5.4,<6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vector_search"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
